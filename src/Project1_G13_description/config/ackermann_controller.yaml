controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    # The controller requires right wheel first, then left wheel.
    traction_joints_names:
      - rear_right_wheel_joint
      - rear_left_wheel_joint
    steering_joints_names:
      - front_right_steering_joint
      - front_left_steering_joint

    wheelbase: 0.15
    traction_track_width: 0.16
    steering_track_width: 0.16
    traction_wheels_radius: 0.0375

    reference_timeout: 0.5
    open_loop: false
    position_feedback: false
    reduce_wheel_speed_until_steering_reached: true
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
